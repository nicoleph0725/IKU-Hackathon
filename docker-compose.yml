# Local development database: PostgreSQL + TimescaleDB (same engine as Tiger Cloud).
# Usage: docker compose up -d
services:
  db:
    image: timescale/timescaledb:latest-pg17
    container_name: studycafe-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: studycafe
      POSTGRES_PASSWORD: studycafe
      POSTGRES_DB: studycafe
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the separate test database used by pytest (runs on first start only).
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/20-init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studycafe -d studycafe"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
